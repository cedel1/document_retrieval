[project]
name = "document-retrieval"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4==4.15.0",
    "lxml==6.1.3",
    "pathvalidate==3.3.1",
    "requests==2.34.2",
    "responses==0.26.3",
    "selenium==4.54.0",
    "urllib3==2.8.0",
    "abcmeta==2.2.1",
    "typing-extensions==4.16.0",
]

[dependency-groups]
dev = [
    "black==26.10.1",
    "coverage==7.17.5",
    "pylint==4.1.4",
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
]

[tool.uv]
package = false

[tool.black]
line-length = 120

[tool.coverage.run]
branch = true
relative_files = true
source = ["."]
omit = [
    "test/*",
    "*/__pycache__/*",
    "*/.venv/*",
    "*/site-packages/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if __name__ == \"__main__\":",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.pylint.main]
ignore-paths = ["test"]

[tool.pylint.format]
max-line-length = 120


[tool.pytest]
minversion = "9.0"
testpaths = [
    "test",
]
