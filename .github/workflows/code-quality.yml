name: Code Quality

on: [ push ]

jobs:
    build:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                python-version: [ "3.11", "3.12", "3.13", "3.14", "3.15" ]
        steps:
            -   uses: actions/checkout@v7
            -   name: Set up Python ${{ matrix.python-version }}
                uses: actions/setup-python@v7
                with:
                    python-version: ${{ matrix.python-version }}
            -   name: Install dependencies
                run: |
                    python -m pip install --upgrade pip
                    pip install pylint black coverage pytest pytest-cov
                    pip install -r requirements.txt
            -   name: Check code formatting with Black
                run: |
                    black --check --config pyproject.toml $(git ls-files '*.py')
            -   name: Analysing the code with pylint
                run: |
                    pylint --rcfile=pyproject.toml $(git ls-files '*.py')
            -   name: Running tests with pytest
                run: |
                    pytest --config-file=pyproject.toml
            -   name: Run tests with coverage
                run: |
                    pytest --cov=src --cov=document_retrieval --cov-report=term --cov-report=xml --cov-fail-under=90
            -   name: Upload coverage report
                if: matrix.python-version == '3.15'
                uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
                with:
                  name: coverage-xml
                  path: coverage.xml

    sonar:
        needs: build
        if: github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        permissions:
          contents: read
        uses: ./.github/workflows/sonar-qube.yml
        secrets: inherit
