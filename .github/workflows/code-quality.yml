name: Code Quality

on: [ push ]

jobs:
    build:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                python-version: [ "3.11", "3.12", "3.13", "3.14", "3.15" ]
        steps:
            -   uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            -   name: Set up Python ${{ matrix.python-version }}
                uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
                with:
                    python-version: ${{ matrix.python-version }}
            -   name: Install uv
                uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
            -   name: Install dependencies
                run: uv sync --frozen
            -   name: Check code formatting with Black
                run: |
                    uv run black --check --config pyproject.toml $(git ls-files '*.py')
            -   name: Analysing the code with pylint
                run: |
                    uv run pylint --rcfile=pyproject.toml $(git ls-files '*.py')
            -   name: Running tests with pytest
                run: |
                    uv run pytest --config-file=pyproject.toml
            -   name: Run tests with coverage
                run: |
                    uv run pytest --cov --cov-report=term --cov-report=xml --cov-fail-under=90
            -   name: Upload coverage report
                if: matrix.python-version == '3.15'
                uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
                with:
                  name: coverage-xml
                  path: coverage.xml

    sonar:
        needs: build
        if: github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        permissions:
          contents: read
        uses: ./.github/workflows/sonar-qube.yml
        secrets: inherit
