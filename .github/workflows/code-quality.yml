name: Code Quality

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15.0-rc.2"]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pylint black coverage pytest pytest-cov
        pip install -r requirements.txt
    - name: Check code formatting with Black
      run: |
        black --check --config pyproject.toml $(git ls-files '*.py')
    - name: Analysing the code with pylint
      run: |
        pylint --rcfile=pyproject.toml $(git ls-files '*.py')
    - name: Running tests with pytest
      run: |
        pytest --config-file=pyproject.toml
    - name: Run tests with coverage
      run: |
        pytest --cov=src --cov=document_retrieval --cov-report=term --cov-fail-under=90
